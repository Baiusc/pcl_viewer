# ------------------------------------------------------------------------------
# Windows (MSVC x64) 自动构建 cloud_viewer
#
# 目的：在 GitHub 托管的 windows-latest 上产出可直接运行的 cloud_viewer.exe，
#       替代「Win11 虚拟机 + UNC 共享盘」那种慢到不可用的本地编译。
#
# 依赖策略：使用 vcpkg 官方 port（pcl[visualization] 会连带构建 VTK），
#           与 README「Windows 10+」一节的 vcpkg 方案一致。
#
# 关于耗时：
#   首次运行需要从源码构建 VTK + PCL + Boost，约 1.5~2 小时；
#   vcpkg 的二进制缓存会通过 actions/cache 保存，之后同 commit 依赖的构建约 10 分钟。
#   若改动过 vcpkg 依赖，请修改 cache key 末尾的版本号强制重建。
# ------------------------------------------------------------------------------

name: Build Windows

on:
  push:
    branches: [cloud_viewer, main, master]
    paths-ignore:
      - 'doc/**'
      - 'matlab/**'
      - 'python/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'matlab/**'
      - 'python/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC x64 / Release
    runs-on: windows-latest
    timeout-minutes: 300

    env:
      # vcpkg 的二进制缓存落在 files provider 目录，由 actions/cache 负责存取。
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        shell: pwsh
        run: |
          cmake --version
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" version
          Write-Host "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"

      # ------------------------------------------------------------------------
      # 缓存 vcpkg 编译产物（.zip 归档按 ABI hash 命名），命中时 install 步骤只做解包
      # ------------------------------------------------------------------------
      - name: 恢复 vcpkg 二进制缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-x64-windows-pcl-v1
          restore-keys: |
            vcpkg-x64-windows-pcl-

      # ------------------------------------------------------------------------
      # 依赖安装
      #   pcl[visualization] -> PCL 1.15 + VTK（vcpkg 会关闭 vtk 默认 feature，只留 opengl）
      #   lz4                -> 在线 RANGE 解压需要 lz4frame.h / lz4.lib
      # ------------------------------------------------------------------------
      - name: 安装依赖（PCL + VTK + LZ4）
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
              "pcl[visualization]:x64-windows" `
              "lz4:x64-windows" `
              --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install 失败" }

      # ------------------------------------------------------------------------
      # 配置 + 编译
      # ------------------------------------------------------------------------
      - name: 配置 (CMake + vcpkg toolchain)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # ------------------------------------------------------------------------
      # 单元测试：当前 beta 相关两个用例本身是失败的（算法断言，与构建无关），
      # 因此不阻塞产物；日志仍保留在 run 里便于排查。
      # ------------------------------------------------------------------------
      - name: 单元测试（不阻塞产物）
        continue-on-error: true
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      # ------------------------------------------------------------------------
      # 打包：exe + 同目录 DLL（CMakeLists 里的 POST_BUILD 已把
      # $<TARGET_RUNTIME_DLLS> 复制到 build/Release，这里再兜底拷一遍）
      # ------------------------------------------------------------------------
      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build\Release\cloud_viewer.exe" dist\ -Force
          Get-ChildItem "build\Release\*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination dist\ -Force
          Copy-Item README.md dist\ -Force -ErrorAction SilentlyContinue
          Write-Host "--- dist ---"
          Get-ChildItem dist | Select-Object Name, Length
          Compress-Archive -Path "dist\*" -DestinationPath "cloud_viewer-windows-x64.zip" -Force

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cloud_viewer-windows-x64
          path: cloud_viewer-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
