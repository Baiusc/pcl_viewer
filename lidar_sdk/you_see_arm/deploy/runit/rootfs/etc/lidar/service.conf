# 仅由可信系统镜像提供；HTTP 请求不能覆盖这些路径。
LIDAR_STORAGE_DEVICE=/dev/mtdblock2
LIDAR_STORAGE_MOUNT=/mnt/mtdblock2
LIDAR_STORAGE_MODE=boot-copy
LIDAR_STORAGE_FSTYPE=jffs2
LIDAR_RAM_DATA=/run/lidar-data
LIDAR_STORAGE_EXEC=/usr/libexec/lidar/lidar-storage
LIDAR_RUN=/run/lidar
LIDAR_SCAN=/run/lidar-services
LIDAR_TEMPLATE=/usr/share/lidar/runit/lidar_mgrd
LIDAR_BOOT_CONFIG=/etc/lidar/boot.json
LIDAR_BOOT=/usr/libexec/lidar/lidar_boot
LIDAR_RUNSV_DIR=/usr/bin/runsvdir
LIDAR_SV=/usr/bin/sv
LIDAR_LOGGER=/usr/bin/logger
LIDAR_MAX_FAILURES=3
LIDAR_STABLE_SECONDS=60
LIDAR_RETRY_SECONDS=2
LIDAR_STOP_SECONDS=15

# 新生成的网络交付包会显式启用；旧版离线包保持原网络启动入口。
LIDAR_NETWORK_ENABLED=0
LIDAR_NETWORK_EXEC=/usr/libexec/lidar/lidar_netd
LIDAR_NETWORK_CTL=/usr/libexec/lidar/lidar_netctl
LIDAR_NETWORK_CONFIG=/etc/lidar/network.json
LIDAR_NETWORK_RUN=/run/lidar-network
LIDAR_NETWORK_SOCKET=/run/lidar-network/control.sock

# 由镜像集成工具根据明确提供的硬件资产生成，不能猜测其他设备的配套。
LIDAR_KERNEL_MODULE=/usr/libexec/lidar/platform/yousee_lidar.ko
LIDAR_MODULE_NOTE=/sys/module/yousee_lidar/notes/.note.gnu.build-id
LIDAR_MODULE_ID=UNPROVISIONED
LIDAR_MOTOR=/usr/libexec/lidar/platform/demo_i2c_motor
LIDAR_PLATFORM_STATE=/run/lidar-platform
LIDAR_INSMOD=/sbin/insmod
LIDAR_DEVICE=/dev/lidar
LIDAR_FUSER=/usr/bin/fuser
