
[system]
log_level                      = "2" ;日志等级，取值范围[0,5]，越小越详细
log_file_path                  = "/var/log/ys.log" ;日志文件保存路径，删除该字段则不保存到文件内
work_mode                      = "0" ;工作模式，0:原始直方图 1:原始点云 2:解算点云 3:灰度图，Beta/Gamma 启动时同步配置驱动接收布局
echo_mode                      = "0" ;回波模式，0:单回波模式 1:双回波模式
echo_type                      = "0" ;回波类型，0:最强回波 1:最后回波 2:第一个回波
coordinate_mode                = "0" ;坐标系模式，0:直角坐标系 1:球坐标系


[hardware]
vcsel_start_location           = "left" ;硬件上起始的vcsel位置，left或者right
fps                            = "10" ;点云的刷新率，单位Hz，10或者20


[network]
center_broadcast_port          = "55000" ;广播端口
center_ip                      = "192.168.110.15" ;上位机IP
local_cmd_port                 = "65000" ;本地的指令端口
center_cmd_port                = "50026" ;上位机的指令端口
local_data_port                = "65001" ;本地的数据端口
center_data_port               = "50027" ;上位机的数据端口
default_state                  = "1" ;默认的工作模式 0:空闲状态 1:扫描状态 2:故障状态 3:调试状态
handshake_timeout_sec          = "5" ;心跳超时时间 单位秒
frame_delay                    = "10" ;每帧间隔时间，单位 ms
protocol                       = "udp" ;发送数据的协议类型 可选：udp/tcp


[config]
set_spad                       = "0" ;是否配置SPAD寄存器 0：不配置 1：配置
set_pl_threshold               = "0" ;是否配置FPGA阈值寄存器 0：不配置 1：配置
set_pl_zero_angle              = "0" ;是否配置零位角寄存器 0：不配置 1：配置
set_pl_side_en                 = "0" ;是否配置面使能寄存器 0：不配置 1：配置
set_pl_standard_encoder        = "0" ;是否配置起始发光编码器值寄存器 0：不配置 1：配置
deal_pl_system_state           = "0" ;是否响应FPGA系统状态寄存器 0：不响应 1：响应
set_vop_bias                   = "0" ;是否设置 SPAD 偏压 0：不配置 1：配置

[thread]
en_dbus_thread                 = "0" ;是否启用 D-Bus 线程 0：不启用线程 1：启用线程
en_camera_trigger_thread       = "0" ;是否获取相机 trigger 信号 0：不启用线程 1：启用线程
en_pl_system_state_thread      = "0" ;是否获取 FPGA 系统状态寄存器 0：不启用线程 1：启用线程
en_report_encoder_thread       = "0" ;是否上报电机实时编码值 0：不启用线程 1：启用线程
