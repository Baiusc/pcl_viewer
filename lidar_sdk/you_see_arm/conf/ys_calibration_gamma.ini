; CS96-gamma(SL100) 标定参数骨架
; 说明: 由 conf/ys_calibration.ini(beta) 派生并按 120 像素扩展得到,
;       逐像素数组(horizontal_angular_offset / zero_distance_offset / distance_factor)
;       以及 [parameter] u 等值必须由标定流程实测后替换, 当前值仅供本地回放验证链路。
; 驱动接收模式: 3 = pointCloud_sl100
[parameter]
lines_v = 120                       ;垂直线数（正整数）
lines_h = 800                        ;水平线数（正整数）
omega0 = -60.0                       ;水平转角零度偏移量（浮点数）
theta_min = -10.0                    ;俯仰角最小值（浮点数）
theta_max = 10.0                     ;俯仰角最大值（浮点数）
theta_tilt = -2.5                    ;俯仰倾斜角（浮点数）
u = 47                               ;SPAD中心在y竖直方向上的偏移量（像素单位）（正整数）
sat_peak_max = 1612                  ;回波的饱和峰值最大值（正整数）
sat_peak_min = 0                     ;回波的饱和峰值最小值（正整数）
dist_max = 200                       ;可测最远距离（正整数）(单位米)
fov_max = 120.0                      ;视场角（浮点数）
k = 1.0                              ;反射率标定系数（浮点数）

[fpga]
threshold_time = 60                  ;阈值标定时间点 取值范围[0,255]（正整数）
threshold_back = 200                 ;背景阈值 取值范围[0,255]（正整数）
vop_bias_freq = 10000                ;SPAD 偏压频率 取值范围（正整数）
vop_bias_duty = 4000                 ;SPAD 偏压占空比 取值范围[0,频率的66%]（正整数）

[side_angular_offset]
side0_angular_offset = 0             ;第0面的水平角相对于第0面的误差 取值范围[0,65535]（正整数）（细调值）
side1_angular_offset = 0             ;第1面的水平角相对于第0面的误差 取值范围[0,65535]（正整数）（细调值）
side2_angular_offset = 0             ;第2面的水平角相对于第0面的误差 取值范围[0,65535]（正整数）（细调值）
side3_angular_offset = 0             ;第3面的水平角相对于第0面的误差 取值范围[0,65535]（正整数）（细调值）

[standard_encoder]
angle_face_1 = 3000                  ;第一面转镜的起始发光编码器值（粗调值）
angle_face_2 = 19384                 ;第二面转镜的起始发光编码器值（粗调值）
angle_face_3 = 35768                 ;第三面转镜的起始发光编码器值（粗调值）
angle_face_4 = 52152                 ;第四面转镜的起始发光编码器值（粗调值）

[side_light]
side_light = 15                      ;每面发光使能设置

[vcsel_index]
pixel_in_vcsel_id0 = 29
pixel_in_vcsel_id1 = 59
pixel_in_vcsel_id2 = 89
pixel_in_vcsel_id3 = 119

[light_intensity]
int_ld0 = 1.0                        ;LD的发光强度 取值范围[0,1]（浮点数）
int_ld1 = 1.0
int_ld2 = 1.0
int_ld3 = 1.0

